name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Oldest version every runner (including Apple silicon macOS) offers, and the newest
        python: ["3.9", "3.13"]
        # Ubuntu 26.04 has no Python 3.9 build; test it on 24.04 instead
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Node is preinstalled on the runners; the JS syntax test uses it.
      # The browser tests are skipped here (no Playwright) and run below.
      - run: python -m unittest -v

  # The injected CSS and JS, run in Chromium on a copy of the webview
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v test_browser
