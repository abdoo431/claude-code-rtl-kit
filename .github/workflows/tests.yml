name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Oldest version every runner (including Apple silicon macOS) offers, and the newest
        python: ["3.9", "3.13"]
        # Ubuntu 26.04 has no Python 3.9 build; test it on 24.04 instead
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Node is preinstalled on the runners; the JS syntax test uses it.
      - run: python -m unittest -v
